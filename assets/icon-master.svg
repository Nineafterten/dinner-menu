    <circle cx="256" cy="256" r="72"/>
    <!-- Fork -->
    <g>
      <line x1="150" y1="150" x2="150" y2="256"/>
      <line x1="132" y1="150" x2="132" y2="196"/>
      <line x1="168" y1="150" x2="168" y2="196"/>
      <path d="M132 196 q18 18 36 0"/>
